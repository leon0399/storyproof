name: Setup
description: pnpm, Node, optional turbo cache, install

inputs:
  node-version:
    description: "Overrides .node-version when set"
    default: ""
  turbo-cache-prefix:
    description: "Turbo cache key prefix (empty = skip)"
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    # Empty node-version falls through to node-version-file in setup-node v7.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ".node-version"
        cache: pnpm

    # Turbo local cache: lets unchanged tasks replay across runs.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.turbo-cache-prefix != ''
      with:
        path: .turbo/cache
        key: ${{ inputs.turbo-cache-prefix }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ inputs.turbo-cache-prefix }}-${{ runner.os }}-

    - run: pnpm install --frozen-lockfile
      shell: bash
