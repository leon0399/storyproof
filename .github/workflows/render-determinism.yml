# TEMPORARY EXPERIMENT — delete this file together with experiments/.
#
# Measures whether Chromium rasterizes identically across architecture,
# container image, and operating system, to decide what belongs in storyproof's
# baseline environment key (today: "chromium-1280x720@1x", carrying neither
# platform nor architecture). See experiments/render-determinism/README.md.
#
# Every job is continue-on-error: this is an investigation, and a cell that
# cannot run (a missing arm64 image tag, say) is itself a result. It must never
# turn the pull request red.

name: render determinism (experiment)

on:
  workflow_dispatch:
  push:
    branches: [task8-packed-consumer]

permissions:
  contents: read

jobs:
  capture:
    name: ${{ matrix.cell }} / ${{ matrix.browser }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The engine axis: every determinism conclusion is per-engine —
        # Firefox and WebKit have their own rasterizers, so the Chromium
        # answers (arch-independent in container, host-dependent when bare)
        # must be re-measured, not assumed, before per-engine capture ships.
        browser: [chromium, firefox, webkit]
        cell:
          - linux-amd64-container
          - linux-arm64-container
          - linux-amd64-bare
          - macos-arm64-bare
        include:
          # Reference: container fonts, amd64.
          - cell: linux-amd64-container
            runner: ubuntu-24.04
            image: mcr.microsoft.com/playwright:v1.55.1-noble
          # Same image, different architecture — isolates arch per engine.
          - cell: linux-arm64-container
            runner: ubuntu-24.04-arm
            image: mcr.microsoft.com/playwright:v1.55.1-noble
          # Bare runner, host fonts — is the container doing work per engine?
          - cell: linux-amd64-bare
            runner: ubuntu-24.04
            image: ""
          # Different OS — per-engine evidence for platform in the key.
          - cell: macos-arm64-bare
            runner: macos-latest
            image: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
      # --ignore-workspace keeps this experiment out of the repository's
      # lockfile and turbo graph entirely.
      - name: Install
        working-directory: experiments/render-determinism
        run: pnpm install --ignore-workspace
      # Bare runners only: --with-deps pulls the engine's system libraries,
      # which WebKit in particular needs. Deliberately SKIPPED in container
      # cells — the image ships version-matched browsers and deps, and
      # --with-deps there only adds a third-party apt dependency (observed
      # failing: NodeSource's repo transiently unsigned, taking every
      # container cell down for a reason that has nothing to do with
      # rendering).
      - name: Install browser (bare runners)
        if: matrix.image == ''
        working-directory: experiments/render-determinism
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Capture
        working-directory: experiments/render-determinism
        env:
          LABEL: ${{ matrix.cell }}-${{ matrix.browser }}
          BROWSER: ${{ matrix.browser }}
        # GitHub's `container:` overrides HOME to a runner-owned mount, and
        # Firefox refuses to launch when $HOME isn't owned by the current
        # user (its own error text). Product container capture is unaffected:
        # a plain `docker run` keeps HOME=/root, which is why firefox passed
        # the full acceptance suite in storyproof's own container path.
        run: |
          if [ -n "${{ matrix.image }}" ]; then export HOME=/root; fi
          node capture.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: render-${{ matrix.cell }}-${{ matrix.browser }}
          path: experiments/render-determinism/out/
          retention-days: 7

  # The question cells 1-4 cannot answer: does the SAME container image produce
  # the same pixels when the host is macOS rather than Linux? Docker on macOS
  # runs the container inside a Linux VM, a boundary the jobs above never
  # cross -- and it is the boundary a mixed macOS/Linux team depends on.
  #
  # Both cells here use `docker run` rather than the `container:` key above, so
  # the Linux cell is a control: it isolates the host OS instead of confounding
  # it with the mechanism used to start the container.
  capture-docker:
    name: docker-run-on-${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            runner: ubuntu-24.04
          - host: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # GitHub's macOS runners ship no container runtime. colima provides one
      # via Apple's virtualization stack. If this step fails the cell is simply
      # unavailable -- which reads nothing like a hash mismatch, so the result
      # stays unambiguous.
      - name: Start a container runtime (macOS only)
        if: matrix.host == 'macos'
        run: |
          brew install docker colima
          colima start
      - name: Capture inside the container
        env:
          LABEL: docker-run-on-${{ matrix.host }}
        working-directory: experiments/render-determinism
        run: |
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e "LABEL=$LABEL" \
            -e PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            mcr.microsoft.com/playwright:v1.55.1-noble \
            sh -c 'npm i --no-save --silent playwright@1.55.1 && node capture.mjs'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: render-docker-run-on-${{ matrix.host }}
          path: experiments/render-determinism/out/
          retention-days: 7
