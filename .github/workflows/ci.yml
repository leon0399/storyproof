# CI — gate PRs on the checks that already pass locally: lint, typecheck,
# format, unit tests, the full tarball chain (pack → inventory → exports), and
# the Playwright visual smoke against the fixture Storybook.
#
# Actions are pinned to commit SHAs (comment = the release tag they resolve to).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: lint · typecheck · unit tests · pack gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # version comes from package.json "packageManager"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter storyproof lint

      - run: pnpm --filter storyproof typecheck

      - run: pnpm run format:check

      # Unit tests include the isolated build-artifact contract (test:build).
      - run: pnpm --filter storyproof test

      # One archive, produced once, carried through every artifact gate.
      - run: pnpm --filter storyproof pack:artifact -- /tmp/storyproof-ci/package.tgz

      - run: pnpm --filter storyproof test:pack -- /tmp/storyproof-ci/package.tgz

      - run: pnpm --filter storyproof test:exports -- /tmp/storyproof-ci/package.tgz

      - run: git diff --exit-code

  visual:
    name: visual smoke (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/storyproof

      # Proves the addon through its actual in-Storybook UI against the
      # fixture project: capture after play, review, approve exact bytes,
      # and rerun as passed.
      - run: pnpm --filter storyproof test:visual

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: packages/storyproof/test-results/
          retention-days: 7
