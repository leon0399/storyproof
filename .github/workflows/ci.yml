# CI — parallel jobs; Node 22/24 matrix on every job where the runtime
# matters (unit tests, visual smoke). The Storybook-version × framework
# matrix arrives with the packed-consumer harness (release plan Task 8) —
# those rows install the packed archive into fixture projects, so they
# can't exist before the harness does.
#
# Actions are pinned to commit SHAs (comment = the release tag they resolve to).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter storyproof lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter storyproof typecheck

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  test:
    name: unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter storyproof test

  # Pack the archive. `pnpm pack` always reruns `build` first via the
  # `prepack` lifecycle script (so a stale build can never be packed), and
  # `build` itself runs publint + attw as build-time gates (configured in
  # tsdown.config.ts) -- so packing alone proves build, publint, and attw
  # all pass, with no separate build step needed. Test coverage (including
  # the tarball-inventory snapshot, test/pack-inventory.test.ts) is the
  # `test` job's job, not this one's -- this job does not run the suite.
  # The packed tarball is uploaded so the `consumer` job below can install
  # the exact same archive rather than repacking.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter storyproof pack --out /tmp/storyproof-ci/package.tgz
      - run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storyproof-package
          path: /tmp/storyproof-ci/package.tgz
          retention-days: 7

  visual:
    name: visual smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/storyproof
      # Proves the addon through its actual in-Storybook UI against the
      # fixture project: capture after play, review, approve exact bytes,
      # and rerun as passed.
      - run: pnpm --filter storyproof test:visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-node${{ matrix.node }}
          path: packages/storyproof/test-results/
          retention-days: 7

  # Packed-consumer harness (release plan Task 8). examples/** are real pnpm
  # workspace members (storyproof: workspace:*) for local development -- a
  # contributor cloning the repo sees their own working tree, not a stale
  # published build. That link proves nothing about the packed npm tarball,
  # so this job copies an example *out* of the workspace before installing
  # it, which both bypasses the workspace link and gives the isolation
  # guarantee for free (no separate negative-control fixture needed): the
  # copy is made before any node_modules exist anywhere in the checkout, so
  # there's nothing to symlink back to source even if we wanted to.
  # VISUAL_TEST_PROJECT_DIR then points the existing test:visual harness
  # (test/fixture-server.ts, test/smoke/addon.spec.ts) at that copy instead
  # of the workspace-source fixture -- no new orchestrator script. Single
  # Node version: coverage across 22/24 is already proven by `test`/`visual`;
  # this matrix's dimension is framework integration (react-vite, nextjs-vite)
  # on the verified Storybook 10.5 floor. A third cell pinning Storybook
  # `~10.0.0` (react-vite-sb10.0) was tried and removed: the addon's manager
  # panel rendered and its buttons were correctly named, but every visual-test
  # run submitted through it never completed (systemic `toBeVisible` timeouts
  # waiting on a result, not an addon-side rendering or naming defect) -- see
  # the release plan's dated note next to Task 8 for the full evidence trail,
  # including why an intra-Storybook version-skew theory was ruled out.
  consumer:
    name: consumer (${{ matrix.example }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example:
          - react-vite-sb10.5
          - nextjs-vite-sb10.5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          cache: pnpm
      # Copied before any `pnpm install` runs in this checkout, so the copy
      # is guaranteed to carry no node_modules (workspace symlinks or
      # otherwise) that could compromise the isolation this job proves.
      - name: Copy the example out of the workspace
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          dir=$(mktemp -d)
          cp -r "examples/$EXAMPLE" "$dir/project"
          echo "consumer_dir=$dir/project" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: storyproof-package
          path: /tmp/storyproof-artifact
      - name: Point the copy at the packed tarball
        working-directory: ${{ env.consumer_dir }}
        run: pnpm pkg set dependencies.storyproof=file:/tmp/storyproof-artifact/package.tgz
      # The copy has no ancestor pnpm-workspace.yaml once outside the repo,
      # but --ignore-workspace is kept for defense in depth: empirically (see
      # the release plan's Task 8 deviation note), a plain `pnpm install`
      # inside a non-member directory *under* this workspace silently no-ops,
      # and a plain `pnpm add` rewrites the *root* pnpm-lock.yaml instead of
      # the target directory's own -- exactly the kind of workspace bleed
      # this job exists to rule out.
      - name: Install the copy in isolation
        working-directory: ${{ env.consumer_dir }}
        run: pnpm install --ignore-workspace
      - name: Assert storyproof resolves under this copy's node_modules
        working-directory: ${{ env.consumer_dir }}
        run: |
          resolved=$(node --input-type=module -e "console.log(import.meta.resolve('storyproof'))")
          case "$resolved" in
            "file://$PWD/node_modules/"*) echo "resolved: $resolved" ;;
            *)
              echo "storyproof did not resolve under $PWD/node_modules (got: $resolved)" >&2
              exit 1
              ;;
          esac
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/storyproof
      - name: Run the acceptance suite against the packed copy
        env:
          VISUAL_TEST_PROJECT_DIR: ${{ env.consumer_dir }}
        run: pnpm --filter storyproof test:visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-consumer-${{ matrix.example }}
          path: packages/storyproof/test-results/
          retention-days: 7
