# Action versions pinned to commit SHAs (tag in trailing comment).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run lint --log-prefix=none -- --format github

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache-prefix: turbo
      - run: pnpm exec turbo run typecheck

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  test:
    name: unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
          turbo-cache-prefix: turbo-node${{ matrix.node }}
      - run: pnpm exec turbo run test

  # `prepack` reruns build (publint + attw gated), so packing alone proves
  # the build. Uploads the tarball for the consumer job.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter storyproof pack --out /tmp/storyproof-ci/package.tgz
      - run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storyproof-package
          path: /tmp/storyproof-ci/package.tgz
          retention-days: 7

  # Acceptance suite: full node × browser × topology cross-product.
  # Turbo cache serves `^build` only — test:visual is uncached.
  acceptance:
    name: acceptance - node ${{ matrix.node }} - ${{ matrix.browser }} - ${{ matrix.topology }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        browser: [chromium, firefox, webkit]
        topology: [host, container]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
          turbo-cache-prefix: turbo-visual-node${{ matrix.node }}
      # Test driver is always chromium; matrix.browser is the addon's capture engine.
      - run: pnpm exec playwright install --with-deps chromium "$BROWSER"
        working-directory: packages/storyproof
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Pre-pull the capture container image
        if: matrix.topology == 'container'
        run: |
          version=$(node -p "require('./packages/storyproof/node_modules/playwright/package.json').version")
          docker pull "mcr.microsoft.com/playwright:v${version}-noble"
      - run: pnpm exec turbo run test:visual
        env:
          STORYPROOF_BROWSER: ${{ matrix.browser }}
          STORYPROOF_CONTAINER: ${{ matrix.topology == 'container' && '1' || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.node }}-${{ matrix.browser }}-${{ matrix.topology }}
          path: packages/storyproof/test-results/
          retention-days: 7

  # Asserts committed baselines still produce the expected panel states.
  # Uses the same script maintainers run to re-approve.
  example-baselines:
    name: example baselines (${{ matrix.example }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { example: react-vite-sb10.5, port: 6106 }
          - { example: nextjs-vite-sb10.5, port: 6107 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/storyproof
      - name: Pre-pull the capture container image
        run: |
          version=$(node -p "require('./packages/storyproof/node_modules/playwright/package.json').version")
          docker pull "mcr.microsoft.com/playwright:v${version}-noble"
      - name: Verify staged states
        run: |
          pnpm --filter "./examples/$EXAMPLE" run dev > /tmp/sb.log 2>&1 &
          sb_pid=$!
          for _ in $(seq 1 90); do curl -sf -o /dev/null "http://localhost:$PORT/" && break; sleep 2; done
          curl -sf -o /dev/null "http://localhost:$PORT/" || { cat /tmp/sb.log; exit 1; }
          (cd packages/storyproof && node scripts/example-states.mjs --port "$PORT" --mode verify)
          kill "$sb_pid"
        env:
          EXAMPLE: ${{ matrix.example }}
          PORT: ${{ matrix.port }}
          STORYPROOF_CONTAINER: "1"
      - name: Storybook logs
        if: failure()
        run: cat /tmp/sb.log 2>/dev/null || true

  # Proves the packed tarball installs and works outside pnpm workspace resolution.
  tarball-install:
    name: tarball install (${{ matrix.example }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example:
          - react-vite-sb10.5
          - nextjs-vite-sb10.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: pnpm
      # Before any install — guarantees no node_modules in the copy.
      - name: Copy the example out of the workspace
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          dir=$(mktemp -d)
          cp -r "examples/$EXAMPLE" "$dir/project"
          echo "tarball_dir=$dir/project" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storyproof-package
          path: /tmp/storyproof-artifact
      - name: Point the copy at the packed tarball
        working-directory: ${{ env.tarball_dir }}
        run: |
          pnpm pkg set dependencies.storyproof=file:/tmp/storyproof-artifact/package.tgz
          # `catalog:` won't resolve outside the workspace; inline the version.
          pw=$(awk '$1 == "playwright:" { print $2; exit }' "$GITHUB_WORKSPACE/pnpm-workspace.yaml")
          case "$pw" in
            "" | *[[:space:]]*)
              echo "::error::no usable playwright entry in the pnpm-workspace.yaml catalog" >&2
              exit 1
              ;;
          esac
          pnpm pkg set devDependencies.playwright="$pw"
      # --ignore-workspace: without it, pnpm silently no-ops under a workspace root.
      - name: Install the copy in isolation
        working-directory: ${{ env.tarball_dir }}
        run: pnpm install --ignore-workspace
      - name: Assert storyproof resolves under this copy's node_modules
        working-directory: ${{ env.tarball_dir }}
        run: |
          resolved=$(node --input-type=module -e "console.log(import.meta.resolve('storyproof'))")
          case "$resolved" in
            "file://$PWD/node_modules/"*) echo "resolved: $resolved" ;;
            *)
              echo "storyproof did not resolve under $PWD/node_modules (got: $resolved)" >&2
              exit 1
              ;;
          esac
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/storyproof
      - name: Run the acceptance suite against the packed copy
        env:
          VISUAL_TEST_PROJECT_DIR: ${{ env.tarball_dir }}
        run: pnpm --filter storyproof test:visual
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-tarball-${{ matrix.example }}
          path: packages/storyproof/test-results/
          retention-days: 7
