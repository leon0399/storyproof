# Versioning half of the release pipeline. Changesets owns "what the next
# version number is"; publishing lives in publish.yml so the approval gate
# and OIDC apply to publishing alone.
#
# On every push to main: pending changesets -> open/refresh the
# "Version Packages" PR. No pending changesets -> `changeset tag` creates
# tags for any released version not yet tagged (none, right after a plain
# merge; the new one, right after the version PR lands), and each new tag is
# handed to publish.yml. The dispatch is explicit because refs created with
# GITHUB_TOKEN never trigger `on: push` workflows — GitHub's recursion
# prevention.

name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version PR / release tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # gh workflow run (the hand-off to publish.yml)
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: `changeset tag` decides what is "new" by
          # comparing manifest versions against existing tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: pnpm

      # --ignore-scripts: the root `prepare` hook builds the addon, which
      # this job never uses.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
          # Commits go through the GitHub API rather than a pushed git
          # remote, so this job needs no persisted checkout credentials.
          # camelCase: the action warns on unknown inputs instead of
          # failing, and the kebab-case spelling was silently ignored.
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag new versions and start their publishes
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          pnpm exec changeset tag | tee /tmp/tags.log
          sed -n 's/.*New tag: *//p' /tmp/tags.log | while read -r tag; do
            gh api "repos/${REPO}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${SHA}" >/dev/null
            gh workflow run publish.yml --ref "$tag"
          done
