# Publish half of the release pipeline, triggered by the storyproof@<version>
# tag release.yml creates. The split (version PR on main, publish from a
# dedicated tag-triggered workflow) is the documented pattern for npm trusted
# publishing with changesets — see changesets/action#515 — and it is what
# lets OIDC and the human approval gate (`release` environment) apply to
# publishing alone.
#
# This workflow deliberately re-verifies nothing. The tagged commit already
# passed ci.yml on main: unit tests including the tarball inventory, the
# packed-consumer acceptance suite, lint, types. **Approve the release only
# when that commit's CI is green** — the approval is the checkpoint. What
# happens here is only: pack once, publish those bytes with provenance,
# prove the registry serves the same digest, and attach the same file to the
# GitHub release — so the npm release and the GitHub release cannot describe
# different bytes.
#
# No npm token exists in this repository (OIDC trusted publishing), and
# dependency caching is off: a poisoned cache could alter the bytes that ship.

name: Publish

on:
  # release.yml dispatches this workflow per new tag (a GITHUB_TOKEN-created
  # ref cannot trigger `on: push`); the push trigger covers tags someone
  # pushes by hand.
  workflow_dispatch:
  push:
    tags:
      - "storyproof@*"

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm and GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      # OIDC for npm trusted publishing; contents for the GitHub release.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # 24.15.0 rather than .node-version's pin: its bundled npm (11.12.1)
      # clears trusted publishing's npm >= 11.5.1 floor, so nothing needs to
      # be installed ad hoc in the release path. (No dependency caching —
      # see header.)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # `pnpm pack` reruns `build` via prepack, which gates on publint + attw.
      - name: Pack the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packages/storyproof/package.json').version")
          # The tag names the version it releases; a mismatch means the tag
          # points at the wrong commit, which must never publish.
          if [ "$TAG" != "storyproof@${version}" ]; then
            echo "Tag ${TAG} does not match manifest version ${version}" >&2
            exit 1
          fi
          # Prereleases must never land on `latest`: npm defaults the tag,
          # and a plain `npm i storyproof` would pick them up.
          case "$version" in
            *-*) dist_tag="next" ;;
            *) dist_tag="latest" ;;
          esac
          pnpm --filter storyproof pack --out /tmp/storyproof-release/package.tgz
          {
            echo "VERSION=${version}"
            echo "DIST_TAG=${dist_tag}"
          } >> "$GITHUB_ENV"

      # The bytes survive the run even if a later step fails, so recovery
      # never requires repacking.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storyproof-release
          path: /tmp/storyproof-release/package.tgz
          retention-days: 7
          if-no-files-found: error

      - name: Publish
        run: |
          npm publish /tmp/storyproof-release/package.tgz \
            --tag "$DIST_TAG" \
            --access public \
            --provenance

      - name: Registry serves the same bytes
        run: |
          local_sri="sha512-$(openssl dgst -sha512 -binary /tmp/storyproof-release/package.tgz | openssl base64 -A)"
          published=$(npm view "storyproof@${VERSION}" dist.integrity)
          if [ "$published" != "$local_sri" ]; then
            echo "Registry reports ${published}, packed ${local_sri}" >&2
            exit 1
          fi
          echo "Registry integrity matches: ${published}" >> "$GITHUB_STEP_SUMMARY"

      # Same file, same job: the GitHub release cannot describe bytes other
      # than the ones npm now serves.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(printf '%s\n' \
            "\`npm install storyproof@${VERSION}\` (dist-tag: \`${DIST_TAG}\`)" \
            "" \
            "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/packages/storyproof/CHANGELOG.md) for what changed.")
          args=(--title "storyproof ${VERSION}" --notes "$notes")
          [ "$DIST_TAG" = "latest" ] || args+=(--prerelease)
          gh release create "$TAG" \
            "/tmp/storyproof-release/package.tgz#storyproof-${VERSION}.tgz" \
            "${args[@]}"
